# ==========================================================
#  板级配置：正点原子 ATK-DL6Y2C V2.8（i.MX6ULL eMMC 版）
#
#  这份文件同时被 make 和 bash 读取，所以只能用 KEY=value：
#    - 不能写 ?= / :=（make 语法，bash 不认）
#    - 值里不能有空格
# ==========================================================

BOARD_NAME=ATK-DL6Y2C
BOARD_VERSION=V2.8

# ---------- 工具链 ----------
# rt-smart 内核必须用 musl 工具链，arm-none-eabi 编不过
CROSS=arm-linux-musleabi-
RTT_EXEC_PATH=/opt/musl-arm/bin

# ---------- 源码树（相对工程根）----------
UBOOT_DIR=uboot
RTT_DIR=rtthread
APPS_DIR=userapps

# ---------- 输出 ----------
# out/ 放最终镜像，out/obj/ 放中间产物（U-Boot out-of-tree 构建目录）
OUT_DIR=out
OBJ_DIR=out/obj

# ---------- Bootloader ----------
UBOOT_DEFCONFIG=mx6ull_atk_defconfig
UBOOT_LOADADDR=0x87800000
SPL_TEXT_BASE=0x00908000
# SPL 填充到 128KB，U-Boot proper 紧跟其后
SPL_PAD_TO=0x20000
# 必须与 SPL_PAD_TO 匹配：(0x400 + SPL_PAD_TO) / 512
SPL_SECTOR=0x102

# ---------- 内核 ----------
KERNEL_LOADADDR=0x80001000
KERNEL_BIN=rtthread.bin

# ---------- 分区尺寸（MB）----------
# p1 必须从 LBA2 起（Boot ROM 只认 1KB 处的 IVT），其余 1MB 对齐
PART_BOOT_MB=4
PART_KERNEL_MB=16
PART_ROMFS_MB=256
PART_RECOVERY_MB=64

# ---------- 整盘镜像默认大小（MB）----------
# 最小需要 612MB（系统占用），留大一点给 data
IMAGE_MB=2048
