# ==========================================================
#  板级配置：正点原子 ATK-DL6Y2C V2.8（i.MX6ULL eMMC 版）
#
#  这份文件被 build/build.sh 直接 source，只能用 KEY=value：
#    - 值里不能有空格
#    - 不要用 ?= / := 这类 make 语法
# ==========================================================

BOARD_NAME=ATK-DL6Y2C
BOARD_VERSION=V2.8

# ---------- 工具链 ----------
# 内核 / 用户态：必须是 musl 工具链（arm-none-eabi 编不过）
CROSS=arm-linux-musleabi-
RTT_EXEC_PATH=/opt/musl-arm/bin

# U-Boot 2016.03：用 glibc 工具链（NXP 原生就是 gnueabihf）
UBOOT_CROSS=arm-linux-gnueabihf-

# ---------- 源码树（相对工程根）----------
UBOOT_SRC=uboot-imx
RTT_DIR=rtthread
APPS_DIR=userapps

# ---------- 输出 ----------
OUT_DIR=out
OBJ_DIR=out/obj

# ---------- Bootloader ----------
# 正点原子 U-Boot 2016.03，eMMC 版
UBOOT_DEFCONFIG=mx6ull_alientek_emmc_defconfig
UBOOT_LOADADDR=0x87800000
# 单级 u-boot.imx 由 Boot ROM 直接搬到 DDR，SPL 方案暂不使用
SPL_TEXT_BASE=0x00908000
SPL_PAD_TO=0x20000
SPL_SECTOR=0x102

# ---------- 内核 ----------
KERNEL_LOADADDR=0x80001000
KERNEL_BIN=rtthread.bin

# ---------- 分区尺寸（MB）----------
# p1 从 LBA2 起（Boot ROM 只认 1KB 处的 IVT），其余 1MB 对齐
PART_BOOT_MB=4
PART_KERNEL_MB=16
PART_ROMFS_MB=256
PART_RECOVERY_MB=64

# ---------- 整盘镜像默认大小（MB）----------
IMAGE_MB=2048

# ---------- fastboot ----------
# U-Boot 的 fastboot flash 只认 GPT 分区表；
# MBR 方案下只能按偏移用 dd/mmc write 烧，见 docs/22-fastboot烧录方案.md
FASTBOOT_MMC_DEV=1
